name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: setiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/setiq?sslmode=disable
      APP_DATABASE_URL: postgresql://setiq_app:setiq_dev_password@localhost:5432/setiq?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci_only_secret
      ENVIRONMENT: test
      DBMATE_MIGRATIONS_DIR: dbmate/migrations
      DBMATE_SCHEMA_FILE: dbmate/schema.sql

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install postgresql-client + dbmate
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          sudo curl -fsSL -o /usr/local/bin/dbmate \
            https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          sudo chmod +x /usr/local/bin/dbmate

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run migrations
        run: dbmate up

      - name: Create app role
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d setiq -f scripts/setup_app_role.sql

      - name: Seed data
        run: |
          python scripts/seed_dev.py
          python scripts/seed_dev_sample.py

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest -q
