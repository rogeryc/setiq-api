name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync code to VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude .git --exclude .github --exclude .venv \
            --exclude __pycache__ --exclude .pytest_cache --exclude .mypy_cache \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/setiq/setiq-api/

      - name: Build, migrate, restart API + worker
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' <<'EOF'
          set -e
          cd /home/ubuntu/setiq
          set -a; source .env; set +a
          docker compose build api worker
          docker run --rm --network setiq_default \
            -v /home/ubuntu/setiq/setiq-api/dbmate:/db \
            -e DATABASE_URL="$DATABASE_URL" \
            -e DBMATE_MIGRATIONS_DIR=/db/migrations \
            -e DBMATE_SCHEMA_FILE=/db/schema.sql \
            ghcr.io/amacneil/dbmate:2 up
          docker compose up -d api worker
          docker compose ps api worker
          EOF
